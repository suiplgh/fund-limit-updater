name: Refresh Fund Limit (018738)
on:
  # 北京时间 09:00 / 14:00 = UTC 01:00 / 06:00
  schedule:
    - cron: '0 1,6 * * *'
  workflow_dispatch:
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch and write fund-limit.json to Gist
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
        run: node action-fetch-fund-limit.js
